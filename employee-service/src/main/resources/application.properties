# Database configuration
# Set these environment variables before running the Spring Boot application.
# Never commit real passwords or JWT secrets to GitHub.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA settings — keep these aligned with your project's existing configuration.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT secret — property name must match what your JWT code reads.
jwt.secret=${JWT_SECRET}
